<div class="signup-container">
  <div class="signup-card">
    <h2>Create Account</h2>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">


      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Enter your email"
        />
        <div class="error" *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid">
          <small *ngIf="signupForm.get('email')?.errors?.['required']">Email is required.</small>
          <small *ngIf="signupForm.get('email')?.errors?.['email']">Invalid email format.</small>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Create a password"
        />
        <div class="error" *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid">
          <small>Password must be at least 6 characters.</small>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          placeholder="Confirm your password"
        />
        <div class="error" *ngIf="signupForm.errors?.['passwordMismatch'] && signupForm.get('confirmPassword')?.touched">
          <small>Passwords do not match.</small>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" [disabled]="signupForm.invalid">
        Sign Up
      </button>
    </form>

    <!-- Login link -->
    <p class="login-link">
      Already have an account?
      <a routerLink="/">Login</a>
    </p>
  </div>
</div>
